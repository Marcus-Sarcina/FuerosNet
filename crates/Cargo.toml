[workspace]
resolver = "3"
# `mobile/` holds the Kotlin and Swift shells, which build with Gradle and
# Xcode and are not Cargo members.
members = ["acceptance", "adaptors", "archive", "cli", "client", "codec", "conformance", "crypto", "daemon", "engine", "ffi", "node", "participant", "policy", "resources", "sim", "transport"]

# Apache-2.0 on every crate, inherited rather than repeated fifteen times,
# so the grant has one place to be correct.  The full text and the copyright
# notice are in `LICENSE` at the repository root.
[workspace.package]
license = "Apache-2.0"
authors = ["Albin Marcus Zuech"]

[workspace.dependencies]
sha2 = "0.11.0"
hex = "0.4.3"
serde_json = "1.0.151"
ed25519-dalek = "3.0.0"
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
# wiping key material that is ours rather than a dalek or aws-lc type's
zeroize = "1.9"

# The reference metric runs one max-flow per candidate; its tests score
# regions of a thousand identities, which an unoptimised build makes slow.
[profile.dev.package.rhtn-policy]
opt-level = 2

# **The same reasoning, for the hybrid signature** [author, 2026-10-22,
# measured]: every record, envelope and catalog entry verifies an ML-DSA
# signature, and unoptimised that is ~1.5 s each — one test registering
# 113 entries took 190 s of the suite's 649, and the decoder's own
# one-second-per-input budget was what capped how far the suite could be
# parallelised. Measured below.
[profile.dev.package.ml-dsa]
opt-level = 3

# The engine runs two convolutional graphs per frame; unoptimised, one
# detection takes seconds on the host, which makes its tests the gate's
# slowest step for nothing.
[profile.dev.package.rhtn-engine]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
