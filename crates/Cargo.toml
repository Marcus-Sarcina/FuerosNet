[workspace]
resolver = "3"
# `mobile/` holds the Kotlin and Swift shells, which build with Gradle and
# Xcode and are not Cargo members.
members = ["acceptance", "adaptors", "archive", "cli", "client", "codec", "conformance", "crypto", "daemon", "ffi", "node", "participant", "policy", "resources", "sim", "transport"]

# Apache-2.0 on every crate, inherited rather than repeated fifteen times,
# so the grant has one place to be correct.  The full text and the copyright
# notice are in `LICENSE` at the repository root.
[workspace.package]
license = "Apache-2.0"
authors = ["Albin Marcus Zuech"]

[workspace.dependencies]
sha2 = "0.11.0"
hex = "0.4.3"
serde_json = "1.0.151"
ed25519-dalek = "3.0.0"
ml-dsa = "0.1.1"
# wiping key material that is ours rather than a dalek or aws-lc type's
zeroize = "1.9"

# The reference metric runs one max-flow per candidate; its tests score
# regions of a thousand identities, which an unoptimised build makes slow.
[profile.dev.package.rhtn-policy]
opt-level = 2
