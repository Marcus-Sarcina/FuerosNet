# Test phones for field-run.sh: <adb serial>=<public key material, hex>[@<wifi ip:port>].
# field-setup.sh writes the material after each wipe and install, and the
# phone's Wi-Fi address for adb (--address-only refreshes the address
# alone); a line with no material is a phone to set up. field-run.sh reads
# this file when it is given no --phone, and reaches a phone that is not
# on USB over Wi-Fi at its address. The material is public.
@192.168.0.6:5555
@192.168.0.7:5555
@192.168.0.10:5555
@192.168.0.11:5555
