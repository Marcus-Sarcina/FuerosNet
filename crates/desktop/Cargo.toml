[package]
name = "rhtn-desktop"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
description = "The operator's desktop: the provider's own console in a window beside the steps, the token pasted back, and the launch driven from there (light-client-requirements.md §10)"

[features]
# **This leaf decides the flavour for the kernel beneath it**, as `rhtnp`
# does (`crates/README.md`, the gating section): releasable by default,
# every diagnostic hook in the graph compiled out.
default = ["releasable"]
releasable = [
    "rhtn-ffi/releasable",
    "tracing/max_level_off",
    "tracing/release_max_level_off",
    "log/max_level_off",
    "log/release_max_level_off",
]
fieldtest = ["rhtn-ffi/fieldtest"]
# **The window and its web view are the system's** (`main.rs`), which on
# this platform means WebKitGTK and GTK 3 with their development files
# present.  Off by default so that the gate, and a continuous-integration
# container with no desktop libraries at all, build and test everything
# below the window: `cargo build -p rhtn-desktop --features gui` is the
# build that opens one.
gui = ["dep:wry", "dep:tao", "dep:keyring"]

[dependencies]
rhtn-launch = { path = "../launch" }
# **the transport is the command line's** (`rhtn_cli::launch::TlsTransport`):
# one TLS client over the system's roots, already written and already
# exercised against two providers, and a second copy of it here would be a
# second place for it to drift
rhtn-cli = { path = "../cli" }
serde_json = { workspace = true }
# **the participant kernel, linked directly** [author, 2026-11-18]: the
# same kernel the phone runs, with no binding between it and the window;
# the flavour is chosen by this crate's features, never the FFI's default
rhtn-ffi = { path = "../ffi", default-features = false }
rhtn-transport = { path = "../transport" }
# the local interface's objects (`wire-format.md` §14.3.3), so the pairing
# composes and reads them through the kernel's own codec
rhtn-client = { path = "../client", default-features = false }
zeroize = { workspace = true }
# MIT OR Apache-2.0; the symbol the phone reads, drawn here as an SVG,
# with none of the crate's image renderers
qrcode = { version = "0.14", default-features = false }
# MIT; named so `releasable` can cap their static levels
tracing = { version = "0.1", default-features = false, features = ["std"] }
log = { version = "0.4", default-features = false }

# Apache-2.0 OR MIT, both; the web view and the window, each the system's
# own rather than a browser shipped with this binary
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }
# MIT OR Apache-2.0; **custody of the storage key is the desktop keyring**
# [author, 2026-11-18]: the Secret Service (GNOME Keyring, KWallet) over
# D-Bus, spoken in Rust so no system D-Bus library is linked
keyring = { version = "3.6", optional = true, default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
rhtn-codec = { path = "../codec" }

[[bin]]
name = "rhtn-desktop"
path = "src/main.rs"
required-features = ["gui"]
