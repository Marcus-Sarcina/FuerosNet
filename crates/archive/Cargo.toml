[package]
name = "rhtn-archive"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
description = "RHTN archive chain and local topology: transaction construction, the per-key Merkle DAG, archive fetch, backward verification, and the table a node keeps of the bindings it has verified"

[dependencies]
rhtn-codec = { path = "../codec" }
rhtn-crypto = { path = "../crypto" }
sha2 = { workspace = true }
# MIT; one diagnostic event at the held-list eviction, compiled out in a
# releasable build by the leaf crate's `tracing/max_level_off`
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
hex = { workspace = true }
serde_json = { workspace = true }
