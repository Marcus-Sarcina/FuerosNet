# OSV-Scanner's configuration for the gate (`check.sh` step 3d), which
# scans the lockfiles that step names against osv.dev and fails on any
# advisory not listed here [author, 2026-11-20].
#
# **An entry here is a reason, never a silence.** Each names one advisory
# id, why it does not halt, and the workspace crate that brings it in, so
# the next reader can tell whether the reason still holds. An advisory
# that stops applying (the crate is updated or gone) leaves its entry
# behind as dead weight: remove it with the update.
#
# The Android build tooling's advisories are not here: the patched releases
# are forced in `mobile/android/build.gradle.kts` and `app/build.gradle.kts`
# instead [author, 2026-11-20: a project with no release or installed base
# is not to lock its toolchain to known advisories], so one reaching the
# lockfiles again halts the gate as any finding does.

# -----------------------------------------------------------------------------
#  RustSec informational advisories [author, 2026-11-20]
#
#  RustSec marks these `informational` (unmaintained or unsound), not
#  vulnerabilities, which is why cargo-deny (step 3c, `deny.toml`) passes
#  them; OSV-Scanner reports them as findings all the same. Ignored here on
#  the same footing as cargo-deny's verdict, and not by updating anything.
# -----------------------------------------------------------------------------

