[package]
name = "rhtn-node"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
description = "RHTN node behaviour above the session: topology propagation and the rootward memo, resolution and the anchor table, currency issuance and its escalation ladder, sibling replication and peering"

[dependencies]
rhtn-codec = { path = "../codec" }
rhtn-crypto = { path = "../crypto" }
rhtn-archive = { path = "../archive" }
rhtn-transport = { path = "../transport" }
rhtn-policy = { path = "../policy" }
sha2 = { workspace = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }

[dev-dependencies]
ed25519-dalek = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }
