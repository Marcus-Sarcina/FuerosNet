[package]
name = "rhtn-ffi"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
description = "The boundary the mobile shells bind to: one facade over rhtn-client and rhtn-adaptors, and the platform's devices passed inward"

[lib]
crate-type = ["lib", "cdylib"]

[features]
# The releasable flavour is the default: every diagnostic hook in this
# crate and below it is compiled out through `tracing/max_level_off`, which
# cargo's feature unification applies to the whole build graph (see
# `rhtn-client`'s manifest and `crates/README.md`).
default = ["releasable"]
releasable = [
    "rhtn-client/releasable",
    "tracing/max_level_off",
    "tracing/release_max_level_off",
    "log/max_level_off",
    "log/release_max_level_off",
]
# The field-test flavour: the hooks stay in and each event reaches the
# platform's `Diagnostics` object as one JSON line.  Built with
# `--no-default-features --features fieldtest`; never shipped.
fieldtest = ["rhtn-client/fieldtest", "dep:tracing-subscriber"]
# the binding generator's command line, for `cargo run --features cli --bin uniffi-bindgen`
cli = ["uniffi/cli"]
# a serving node and test identities exported to a binding's round trip;
# never in a shell's build
harness = ["dep:rhtn-node", "dep:rhtn-codec"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[[bin]]
name = "payload-peer"
path = "src/bin/payload-peer.rs"
required-features = ["harness"]

[dependencies]
zeroize = { workspace = true }
# MPL-2.0, allowed for the binding generator [author, 2026-09-16]
uniffi = "0.32"
rhtn-node = { path = "../node", optional = true }
rhtn-codec = { path = "../codec", optional = true }
rhtn-adaptors = { path = "../adaptors" }
rhtn-archive = { path = "../archive" }
# the flavour is chosen here, by this crate's features, and never by the
# client's own default
rhtn-client = { path = "../client", default-features = false }
rhtn-crypto = { path = "../crypto" }
rhtn-transport = { path = "../transport" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }
# MIT; already in the graph through quinn
tracing = { version = "0.1", default-features = false, features = ["std"] }
# MIT OR Apache-2.0; already in the graph through tracing, named so
# `releasable` can cap its static level (rhtn-client's manifest says why)
log = { version = "0.4", default-features = false }
# MIT; the registry the field-test renderer is installed on
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"], optional = true }

[dev-dependencies]
rhtn-codec = { path = "../codec" }
rhtn-node = { path = "../node" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
