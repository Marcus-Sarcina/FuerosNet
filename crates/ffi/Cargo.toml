[package]
name = "rhtn-ffi"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
description = "The boundary the mobile shells bind to: one facade over rhtn-client and rhtn-adaptors, and the platform's devices passed inward"

[dependencies]
rhtn-adaptors = { path = "../adaptors" }
rhtn-archive = { path = "../archive" }
rhtn-client = { path = "../client" }
rhtn-crypto = { path = "../crypto" }
rhtn-transport = { path = "../transport" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }

[dev-dependencies]
rhtn-codec = { path = "../codec" }
rhtn-node = { path = "../node" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
