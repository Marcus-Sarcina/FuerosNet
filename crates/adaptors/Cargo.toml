[package]
name = "rhtn-adaptors"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
description = "RHTN adaptors: the participant client bound to what is local to its process, the node beside it for the queries it answers as verifier and the transport's socket for the direct payload path, for a light client and for a node that is a participant"

[dependencies]
rhtn-codec = { path = "../codec" }
rhtn-crypto = { path = "../crypto" }
rhtn-archive = { path = "../archive" }
# no default: the diagnostics flavour is the leaf crate's choice (rhtn-ffi),
# and a default taken here would be unified into every build above it
rhtn-client = { path = "../client", default-features = false }
rhtn-node = { path = "../node" }
rhtn-transport = { path = "../transport" }
# the diagnostics hooks; the leaf crate's flavour compiles them in or out
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }

[features]
# **The diagnostics flavour, for this crate's own tests.** The hooks and
# the JSON-line renderer live in `rhtn-client` behind its `fieldtest`
# feature; `tests/redaction.rs` sweeps what they render over a whole
# ceremony and so has to be built with them in. No default: the flavour is
# the leaf crate's choice everywhere else.
fieldtest = ["rhtn-client/fieldtest"]

[dev-dependencies]
# opt-in test logging: `RUST_LOG=node=debug cargo test -p rhtn-adaptors`
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }
# the redaction sweep reads the JSON lines the field build renders
serde_json = { workspace = true }
