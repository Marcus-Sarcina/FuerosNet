stages:
  - test
  - deploy

# The gate, as GitLab runs it.  Lives under crates/ because the repository's
# root holds the design documents alone; the project's CI/CD setting "CI/CD
# configuration file" must point at `crates/.gitlab-ci.yml`.
#
# The job needs a runner that can run Docker images (a shared runner, or
# `gitlab-runner` registered on a machine with Docker).  The Kotlin step
# needs a JDK and the Kotlin compiler; both are installed below, so the gate
# runs its round trip here rather than skipping it.
gate:
  stage: test
  image: rust:1-bookworm
  # **A gate a newer push has superseded is cancelled** [author,
  # 2026-11-27]: the runner is the author's own machine, and two gates
  # compiling there at once stalled it. With the project's "Auto-cancel
  # redundant pipelines" on, a push to master stops the older pipeline's
  # gate; `image-publish` is not interruptible, so a push to a registry
  # already under way finishes rather than leaving a tag half written.
  interruptible: true
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    KOTLIN_VERSION: "2.4.20"
    JNA_VERSION: "5.17.0"
    # GitHub's published digest for the zip; Maven Central publishes only
    # a SHA-1 for the jar, which the copy hashed here matched [2026-11-27]
    KOTLIN_SHA256: "59e9ca74c7904ef2c122b12114937673ccce68de820a663f0ed66ccf8799e0b7"
    JNA_SHA256: "b3a9408e7c51e08ef0e3bfcc08f443f6ec0f6191ba8cd7c18d53d2b22e5bdbc0"
    # The checkout cleaner spares the two build directories, which live in
    # the runner's per-project build volume between jobs; this is the whole
    # caching arrangement, faster than packing a multi-gigabyte target/
    # into GitLab's cache archive and back out.
    GIT_CLEAN_FLAGS: -ffdx -e .cargo/ -e crates/target/
    # The checkout itself is retried.  On 2026-10-12 a job failed in the
    # predefined container with git's exit 128 after about two minutes of
    # fetching, having left an empty FETCH_HEAD and no `.git/config` in
    # the build directory it reuses; a shallow fetch of the same ref from
    # the same machine took seven seconds, so the server was not the
    # trouble.  A retry re-runs the whole step, which re-initialises that
    # repository before fetching again.
    GET_SOURCES_ATTEMPTS: 3
    # **The two scanners of `check.sh` steps 3d and 3e, pinned, and each
    # download checked against the sha256 recorded here** [author,
    # 2026-11-20], so CI runs what the author's machine runs and a
    # tampered or substituted download stops the job before it runs.
    # Installed where `check.sh` looks by default, under `$HOME/opt`.
    # OSV-Scanner's digest is the one in the release's SHA256SUMS;
    # Opengrep's is the one GitHub publishes for the release asset, whose
    # sigstore signature was checked when it was pinned. The rules are the
    # opengrep-rules repository at one commit, as GitHub's tarball of it:
    # its digest is this file's own, taken twice on the day it was pinned
    # and equal both times. A bump changes the version and its digest
    # together, and `check.sh`'s default path with them.
    OSV_SCANNER_VERSION: "2.7.1"
    OSV_SCANNER_SHA256: "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8"
    OPENGREP_VERSION: "2.0.0"
    OPENGREP_SHA256: "37e93f4da5fd04a18c5c1febbdd12f7e98dfccd4d0c9cf2593bcb25eeb462da0"
    OPENGREP_RULES_COMMIT: "f1d2b562b414783763fd02a6ed2736eaed622efa"
    OPENGREP_RULES_SHA256: "9a5f1cd5c625418cc1c776120123e2d4371df9bb66e099426b17c3488e13619d"
  before_script:
    # the last three are the desktop window's, which check.sh lints where
    # they are present
    - apt-get update -qq && apt-get install -y -qq python3 openjdk-17-jdk-headless unzip curl pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev > /dev/null
    - rustup component add rustfmt clippy
    - cargo install cargo-deny cargo-sweep cargo-nextest --locked
    - mkdir -p "$HOME/opt/downloads" && cd "$HOME/opt"
    - curl -sSfL -o kotlin.zip "https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN_VERSION/kotlin-compiler-$KOTLIN_VERSION.zip"
    - echo "$KOTLIN_SHA256  kotlin.zip" | sha256sum -c -
    - unzip -q kotlin.zip
    - curl -sSfL -o "downloads/jna-$JNA_VERSION.jar" "https://repo1.maven.org/maven2/net/java/dev/jna/jna/$JNA_VERSION/jna-$JNA_VERSION.jar"
    - echo "$JNA_SHA256  downloads/jna-$JNA_VERSION.jar" | sha256sum -c -
    - mkdir -p "osv-scanner/v$OSV_SCANNER_VERSION" "opengrep/v$OPENGREP_VERSION" "opengrep/rules-$(printf %.7s "$OPENGREP_RULES_COMMIT")"
    - curl -sSfL -o "osv-scanner/v$OSV_SCANNER_VERSION/osv-scanner_linux_amd64" "https://github.com/google/osv-scanner/releases/download/v$OSV_SCANNER_VERSION/osv-scanner_linux_amd64"
    - echo "$OSV_SCANNER_SHA256  osv-scanner/v$OSV_SCANNER_VERSION/osv-scanner_linux_amd64" | sha256sum -c -
    - curl -sSfL -o "opengrep/v$OPENGREP_VERSION/opengrep_linux_x86" "https://github.com/opengrep/opengrep/releases/download/v$OPENGREP_VERSION/opengrep_linux_x86"
    - echo "$OPENGREP_SHA256  opengrep/v$OPENGREP_VERSION/opengrep_linux_x86" | sha256sum -c -
    - chmod +x "osv-scanner/v$OSV_SCANNER_VERSION/osv-scanner_linux_amd64" "opengrep/v$OPENGREP_VERSION/opengrep_linux_x86"
    - curl -sSfL -o "downloads/opengrep-rules-$OPENGREP_RULES_COMMIT.tar.gz" "https://codeload.github.com/opengrep/opengrep-rules/tar.gz/$OPENGREP_RULES_COMMIT"
    - echo "$OPENGREP_RULES_SHA256  downloads/opengrep-rules-$OPENGREP_RULES_COMMIT.tar.gz" | sha256sum -c -
    - tar -xzf "downloads/opengrep-rules-$OPENGREP_RULES_COMMIT.tar.gz" -C "opengrep/rules-$(printf %.7s "$OPENGREP_RULES_COMMIT")" --strip-components=1
    - cd "$CI_PROJECT_DIR"
  script:
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 RHTN_JNA_JAR="$HOME/opt/downloads/jna-$JNA_VERSION.jar"
    - export PATH="$HOME/opt/kotlinc/bin:$PATH"
    - cd crates && ./check.sh

# **The node image, built and pushed on every commit to master that passed
# the gate** (`infra-client-requirements.md` §9: a node is distributed as a
# container image; `light-client-requirements.md` §10: the launch pulls it
# from the reference registry).  Kaniko builds the Containerfile without a
# docker daemon or privileges, which is what lets this run under the same
# runner as the gate.  Tagged with the commit, so an image on a rented host
# traces back to the tree that made it, and `latest` beside it.
#
# **Pushed to two registries, and the one a launch pulls from is Docker
# Hub** [author, 2026-11-03]: this forge is resource-starved and Docker Hub
# is built to serve pulls at the rate a launch path produces.  The forge
# keeps every commit-tagged image beside the code that built it, which is
# what traces a rented host back to a tree; `latest` on Docker Hub is what
# `Launch.REGISTRY_DEFAULT` names and what `cloud-init` asks for.
#
# **Visibility was never the problem.** The image here is public and was
# still unpullable: `ggcr.io/v2/` answers `401` naming the realm
# `gitgud.io/jwt/auth`, and that realm answers an anonymous pull scope with
# `403` and a bot interstitial, which no container engine passes.  Two
# launches produced a running machine with no node before the cause was
# found (`launch::silence`, 2026-11-03).  A launch exists for an operator
# with no shell, so the pull may not need a credential — which is the whole
# of why the default moved.
#
# What this needs, the author's: `DOCKERHUB_USER` and `DOCKERHUB_TOKEN` as
# masked CI variables, the token write-scoped to the namespace below.
# **Until they are set this job still passes** and pushes to the forge
# alone, so a missing secret never breaks master; the Docker Hub
# destinations appear once the token does.
image-publish:
  stage: deploy
  needs: [gate]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    GIT_CLEAN_FLAGS: -ffdx
    # the namespace is flat on Docker Hub: docker.io/<namespace>/rhtnd
    DOCKERHUB_NAMESPACE: sarcina
  script:
    - mkdir -p /kaniko/.docker
    - |
      gl="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      dest="--destination $CI_REGISTRY_IMAGE/rhtnd:$CI_COMMIT_SHORT_SHA"
      dest="$dest --destination $CI_REGISTRY_IMAGE/rhtnd:latest"
      if [ -n "${DOCKERHUB_TOKEN:-}" ]; then
        dh="$(printf '%s:%s' "$DOCKERHUB_USER" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')"
        printf '{"auths":{"%s":{"auth":"%s"},"https://index.docker.io/v1/":{"auth":"%s"}}}' \
          "$CI_REGISTRY" "$gl" "$dh" > /kaniko/.docker/config.json
        dest="$dest --destination docker.io/$DOCKERHUB_NAMESPACE/rhtnd:$CI_COMMIT_SHORT_SHA"
        dest="$dest --destination docker.io/$DOCKERHUB_NAMESPACE/rhtnd:latest"
      else
        printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$gl" > /kaniko/.docker/config.json
        echo "DOCKERHUB_TOKEN is unset: pushing to $CI_REGISTRY_IMAGE only." >&2
        echo "A launch pulls docker.io/$DOCKERHUB_NAMESPACE/rhtnd:latest, which this run does not refresh." >&2
      fi
      /kaniko/executor \
        --context "$CI_PROJECT_DIR/crates" \
        --dockerfile "$CI_PROJECT_DIR/crates/packaging/Containerfile" \
        --build-arg FLAVOUR=releasable \
        $dest
