stages:
  - test
  - deploy

# The gate, as GitLab runs it.  Lives under crates/ because the repository's
# root holds the design documents alone; the project's CI/CD setting "CI/CD
# configuration file" must point at `crates/.gitlab-ci.yml`.
#
# The job needs a runner that can run Docker images (a shared runner, or
# `gitlab-runner` registered on a machine with Docker).  The Kotlin step
# needs a JDK and the Kotlin compiler; both are installed below, so the gate
# runs its round trip here rather than skipping it.
gate:
  stage: test
  image: rust:1-bookworm
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    KOTLIN_VERSION: "2.4.20"
    JNA_VERSION: "5.17.0"
    # The checkout cleaner spares the two build directories, which live in
    # the runner's per-project build volume between jobs; this is the whole
    # caching arrangement, faster than packing a multi-gigabyte target/
    # into GitLab's cache archive and back out.
    GIT_CLEAN_FLAGS: -ffdx -e .cargo/ -e crates/target/
    # The checkout itself is retried.  On 2026-10-12 a job failed in the
    # predefined container with git's exit 128 after about two minutes of
    # fetching, having left an empty FETCH_HEAD and no `.git/config` in
    # the build directory it reuses; a shallow fetch of the same ref from
    # the same machine took seven seconds, so the server was not the
    # trouble.  A retry re-runs the whole step, which re-initialises that
    # repository before fetching again.
    GET_SOURCES_ATTEMPTS: 3
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 openjdk-17-jdk-headless unzip curl > /dev/null
    - rustup component add rustfmt clippy
    - cargo install cargo-deny cargo-sweep cargo-nextest --locked
    - mkdir -p "$HOME/opt/downloads" && cd "$HOME/opt"
    - curl -sSL -o kotlin.zip "https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN_VERSION/kotlin-compiler-$KOTLIN_VERSION.zip" && unzip -q kotlin.zip
    - curl -sSL -o "downloads/jna-$JNA_VERSION.jar" "https://repo1.maven.org/maven2/net/java/dev/jna/jna/$JNA_VERSION/jna-$JNA_VERSION.jar"
    - cd "$CI_PROJECT_DIR"
  script:
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 RHTN_JNA_JAR="$HOME/opt/downloads/jna-$JNA_VERSION.jar"
    - export PATH="$HOME/opt/kotlinc/bin:$PATH"
    - cd crates && ./check.sh

# **The node image, built and pushed on every commit to master that passed
# the gate** (`infra-client-requirements.md` §9: a node is distributed as a
# container image; `light-client-requirements.md` §10: the launch pulls it
# from the reference registry).  Kaniko builds the Containerfile without a
# docker daemon or privileges, which is what lets this run under the same
# runner as the gate.  Tagged with the commit, so an image on a rented host
# traces back to the tree that made it, and `latest` beside it.
#
# What this needs on the GitLab side, both the author's: the project's
# container registry enabled (it is), and the image pullable without
# credentials — which is the project's visibility, since the registry's
# follows it.  `$CI_REGISTRY_IMAGE` is the registry host and project path
# GitLab supplies; the default the client pulls from (`Launch.REGISTRY_DEFAULT`)
# must name the same host and path.
image-publish:
  stage: deploy
  needs: [gate]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    GIT_CLEAN_FLAGS: -ffdx
  script:
    - mkdir -p /kaniko/.docker
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" > /kaniko/.docker/config.json
    - /kaniko/executor
        --context "$CI_PROJECT_DIR/crates"
        --dockerfile "$CI_PROJECT_DIR/crates/packaging/Containerfile"
        --build-arg FLAVOUR=releasable
        --destination "$CI_REGISTRY_IMAGE/rhtnd:$CI_COMMIT_SHORT_SHA"
        --destination "$CI_REGISTRY_IMAGE/rhtnd:latest"
