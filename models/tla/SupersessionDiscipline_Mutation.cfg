\* MUTATION of SupersessionDiscipline.cfg: SeriesCheck = FALSE.
\*
\* The series rule is not observed: the subject may reissue into a series it
\* has occupied before (light-client 2), and a node holding the chain does not
\* reject the repeat (wire 4.6).  The chain 0 -> 1 -> 0 then arrives, the
\* node's record walks back onto a series the chain itself shows was left,
\* and the node issues for it while breaking none of its OWN rules.
\*
\* TLC is EXPECTED TO REPORT A VIOLATION of NeverIssuedForASupersededKey.
\* `run-all.sh` fails if it does not.  That is what keeps the compliant-world
\* result honest: the invariant holds because of a rule in another document
\* binding another party, not because the state machine could not do
\* otherwise.

SPECIFICATION Spec

CONSTANTS
  Nodes = {n1, n2}
  MaxGen = 2
  MaxLen = 3
  SeriesCheck = FALSE
  OrderCheck = TRUE

INVARIANTS
  TypeOK
  NeverIssuedForASupersededKey
