\* MUTATION of IssuerAuthorisation.cfg: StaleOK = TRUE -- acceptance may
\* rest on any role ever recorded, which is what a permanently persistent
\* authorisation record amounts to.  StaleOK = FALSE, in
\* IssuerAuthorisation.cfg, is the current reading.
\*
\* TLC is EXPECTED TO REPORT A VIOLATION of
\* NeverAcceptedOnALapsedAuthorisation.  `run-all.sh` fails if it does not.

SPECIFICATION Spec

CONSTANTS
  Parties = {r1}
  Issuers = {i1}
  Roles = {patron, sibling}
  StaleOK = TRUE

INVARIANTS
  TypeOK
  NeverAcceptedOnALapsedAuthorisation
