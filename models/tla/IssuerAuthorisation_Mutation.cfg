\* MUTATION: StaleOK = TRUE -- acceptance may rest on any role ever
\* One relying party and one issuer suffice: the property is per (R, I) pair,
\* and two roles are enough for the ladder to move.
\*
\* StaleOK = TRUE is the current reading. The mutation is
\* IssuerAuthorisation_Mutation.cfg, which sets it TRUE and EXPECTS
\* NeverAcceptedOnALapsedAuthorisation to be violated.

SPECIFICATION Spec

CONSTANTS
  Parties = {r1}
  Issuers = {i1}
  Roles = {patron, sibling}
  StaleOK = TRUE

INVARIANTS
  TypeOK
  NeverAcceptedOnALapsedAuthorisation
