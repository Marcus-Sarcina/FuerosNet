\* TLC configuration for SupersessionDiscipline.tla.
\* Two nodes, so that an adoption reaching one and not the other is a
\* reachable state rather than an assumption.  Three generations is the
\* smallest instance in which a walk-back has somewhere to go.
\*
\* SeriesCheck = TRUE is the compliant world.  The mutation is
\* SupersessionDiscipline_Mutation.cfg, which sets it FALSE and EXPECTS
\* NeverIssuedForASupersededKey to be violated.

SPECIFICATION Spec

CONSTANTS
  Nodes = {n1, n2}
  MaxGen = 2
  SeriesCheck = TRUE

INVARIANTS
  TypeOK
  NeverIssuedForASupersededKey
  NothingServedAfterSupersession
  RecordIsNeverSuperseded
  ServingIsNeverSuperseded
