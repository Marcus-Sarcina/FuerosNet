\* TLC configuration for SupersessionDiscipline.tla.
\* Two nodes, so that a chain reaching one and not the other is a reachable
\* state rather than an assumption.  Three series is the smallest instance
\* in which a walk-back has somewhere to go, and in which a node can take
\* the chain's third state without having seen its second.
\*
\* SeriesCheck = TRUE and OrderCheck = TRUE is the compliant world.  The
\* mutations are SupersessionDiscipline_Mutation.cfg (SeriesCheck = FALSE)
\* and SupersessionDiscipline_OrderMutation.cfg (OrderCheck = FALSE); each
\* EXPECTS NeverIssuedForASupersededKey to be violated.

SPECIFICATION Spec

CONSTANTS
  Nodes = {n1, n2}
  MaxGen = 2
  MaxLen = 3
  SeriesCheck = TRUE
  OrderCheck = TRUE

INVARIANTS
  TypeOK
  HeldIsAPrefix
  NeverIssuedForASupersededKey
  NothingServedAfterSupersession
  RecordIsNeverSuperseded
  ServingIsNeverSuperseded
