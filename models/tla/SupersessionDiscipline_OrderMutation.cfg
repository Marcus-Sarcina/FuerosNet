\* MUTATION of SupersessionDiscipline.cfg: OrderCheck = FALSE.
\*
\* wire 4.6.1's ordering is not observed: a node takes whatever chain arrives
\* last, so a SHORTER chain replaces a longer one.  A node holding 0 -> 1 -> 2
\* then takes 0 -> 1, records 1 as current -- a series it had learned was left
\* -- and issues for it.  This is the case the earlier generation-per-node
\* model could not express: the stale series is one this node never itself
\* recorded, and only the chain says it was occupied.
\*
\* TLC is EXPECTED TO REPORT A VIOLATION of NeverIssuedForASupersededKey.
\* `run-all.sh` fails if it does not.

SPECIFICATION Spec

CONSTANTS
  Nodes = {n1, n2}
  MaxGen = 2
  MaxLen = 3
  SeriesCheck = TRUE
  OrderCheck = FALSE

INVARIANTS
  TypeOK
  NeverIssuedForASupersededKey
