\* MUTATION of CurrencyEscalation.cfg: GraceOK = TRUE.
\*
\* The held attestation may be extended while the patron is down -- the
\* grace period design Section 12.6.5.1 names and rejects ("Do not").  The
\* attestation gets younger with nobody positioned to sign it.
\*
\* TLC is EXPECTED TO REPORT A VIOLATION of FreshOnly.  `run-all.sh` fails
\* if it does not: that is what keeps the compliant-world result honest --
\* the property holds because every renewal is a rung issuing under its
\* conditions, not because the state machine could not do otherwise.

SPECIFICATION Spec

CONSTANTS
  Subject = s0
  Patron = p0
  Siblings = {b1, b2}
  Grandpatron = g0
  LIFETIME = 3
  GraceOK = TRUE

INVARIANTS
  TypeOK

PROPERTIES
  FreshOnly
