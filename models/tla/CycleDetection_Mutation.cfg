\* MUTATION of CycleDetection_FourNodes.cfg: CutAnyChild = TRUE.
\*
\* Repair may cut ANY direct subordinate of the detector rather than the one
\* that handed the memo over (wire Section 10.2.4).  On four nodes that lets
\* every cycle-detecting memo be spent cutting an innocent off-cycle child,
\* after which the remaining memos circle the loop forever and never reach
\* their subjects.
\*
\* TLC is EXPECTED TO REPORT that the temporal property CyclesResolve is
\* violated.  `run-all.sh` fails if it does not: that is what keeps the
\* compliant-world result honest -- cycles resolve because repair follows
\* the arrival branch, not because the model could not do otherwise.

SPECIFICATION Spec

CONSTANTS
  Nodes = {a, b, d, e}
  None = None
  MaxEvents = 4
  CutAnyChild = TRUE

INVARIANTS
  TypeOK

PROPERTIES
  CyclesResolve
