\* TLC configuration for CurrencyEscalation.tla.
\* One subject, one patron, two siblings, one grandpatron -- the smallest
\* instance in which all three rungs of the ladder are distinct.
\*
\* GraceOK = FALSE is the rule.  The mutation is
\* CurrencyEscalation_Mutation.cfg, which sets it TRUE and EXPECTS FreshOnly
\* to be violated.

SPECIFICATION Spec

CONSTANTS
  Subject = s0
  Patron = p0
  Siblings = {b1, b2}
  Grandpatron = g0
  LIFETIME = 3
  GraceOK = FALSE

INVARIANTS
  TypeOK
  SomeIssuerCanAct

PROPERTIES
  FreshOnly
  LadderMakesProgress
  SiblingRungServes
  GrandpatronRungServes
