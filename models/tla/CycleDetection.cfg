\* TLC configuration for CycleDetection.tla.
\* Three nodes and three adoptions is the smallest instance that can close
\* a patron cycle (a -> b -> c -> a) through concurrent, individually-legal
\* adoptions.  It is NOT enough to exercise which subordinate repair cuts:
\* on a three-node cycle each node has one child, so every choice is the
\* right one.  CycleDetection_FourNodes.cfg is the instance where the
\* choice exists.
\*
\* RUN WITH -deadlock (deadlock checking OFF).  This model TERMINATES: once
\* every node is adopted and every memo is consumed or has reached a root,
\* no action is enabled -- a legitimate quiescent end state that TLC's
\* default deadlock check would flag as an error.  The property that matters
\* -- a cycle never persists forever -- is the CyclesResolve temporal
\* property, which is checked regardless.  The run-all.sh script passes
\* -deadlock; if you invoke TLC by hand, add it.

SPECIFICATION Spec

CONSTANTS
  Nodes = {a, b, c}
  None = None
  MaxEvents = 3
  CutAnyChild = FALSE

INVARIANTS
  TypeOK

PROPERTIES
  CyclesResolve
