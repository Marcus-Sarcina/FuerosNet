\* CycleDetection.tla on FOUR nodes and four adoptions: the smallest instance
\* in which a cycle node can have a child that is NOT on the cycle -- a
\* two-cycle a <-> b with d under a and e under b -- so that which
\* subordinate repair cuts is a real choice.  A cross-family review showed
\* the earlier model spending every memo on the innocent children here and
\* leaving the cycle standing; this configuration is the regression.
\* Run with -deadlock, as CycleDetection.cfg explains.

SPECIFICATION Spec

CONSTANTS
  Nodes = {a, b, d, e}
  None = None
  MaxEvents = 4
  CutAnyChild = FALSE

INVARIANTS
  TypeOK

PROPERTIES
  CyclesResolve
