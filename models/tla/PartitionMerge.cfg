\* TLC configuration for PartitionMerge.tla.
\* A .cfg file tells the TLC model checker which finite values to use for
\* the CONSTANTS, which formula is the specification, and what to check.

SPECIFICATION Spec

\* Three nodes and three events is the standard small model for
\* convergence: enough to adopt, depart, partition and heal with divergent
\* views, small enough that TLC can build the full state graph the liveness
\* (Convergence) property needs.  A four-node / four-event instance explodes
\* past 20 million states because `severed` (all node-pair subsets) times the
\* per-node stores is combinatorial; the property is not scale-dependent, so
\* the small instance is the faithful check.
CONSTANTS
  Nodes = {a, b, c}
  None = None
  MaxEvents = 3

INVARIANTS
  TypeOK
  SelfTruth
  NoInvention

PROPERTIES
  Convergence
