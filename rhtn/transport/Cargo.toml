[package]
name = "rhtn-transport"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
description = "RHTN transport binding: QUIC with TLS 1.3, X25519MLKEM768 only, raw public keys both ways, ALPN rhtn/1, and the stream-0 session"

[dependencies]
rhtn-codec = { path = "../codec" }
rhtn-crypto = { path = "../crypto" }
rhtn-archive = { path = "../archive" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "logging", "tls12"] }
rustls-pki-types = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
ed25519-dalek = { workspace = true, features = ["pkcs8", "alloc"] }
sha2 = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
serde_json = { workspace = true }
