[package]
name = "rhtn-sim"
version = "0.1.0"
edition = "2024"
description = "In-process multi-node harness: a datagram-level path that can drop, delay, blackhole and replay, and the scripted scenarios the TLA+ models are restated over"

[dependencies]
rhtn-codec = { path = "../codec" }
rhtn-crypto = { path = "../crypto" }
rhtn-archive = { path = "../archive" }
rhtn-transport = { path = "../transport" }
rhtn-node = { path = "../node" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }

[dev-dependencies]
hex = { workspace = true }
serde_json = { workspace = true }
