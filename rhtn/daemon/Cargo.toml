[package]
name = "rhtn-daemon"
version = "0.1.0"
edition = "2024"
description = "rhtnd: a node run from an operator's configuration, and the operator's view of what that configuration exposes"

[[bin]]
name = "rhtnd"
path = "src/main.rs"

[dependencies]
rhtn-archive = { path = "../archive" }
rhtn-node = { path = "../node" }
rhtn-crypto = { path = "../crypto" }
rhtn-transport = { path = "../transport" }
rhtn-codec = { path = "../codec" }
rhtn-resources = { path = "../resources" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
rhtn-sim = { path = "../sim" }
rhtn-resources = { path = "../resources" }
